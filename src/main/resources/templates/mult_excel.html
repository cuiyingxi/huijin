<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/bootstrap.css}"/>
    <script src="/js/jquery.js"></script>
    <script src="/js/bootstrap.js"></script>

    <link rel="shortcut icon" th:href="@{/images/favicon.ico}" />

    <title>XXX1大桥</title>
</head>

<body th:style="'background-image: url(/images/background.jpg)'">
<style>
    body{ font-family:"黑体"}
</style>


<div class="container" style="margin-top: 60px">
    <div>
        <label style="font-size: 20px; ">工程进度同步</label>
    </div>

    <form action="/uploadExcelAndParse" method="POST" enctype="multipart/form-data">

        <div class="with:80%">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>sheet页名称</th>
                    <th>标题在第几行</th>
                    <th>一共需要解析多少列</th>
                </tr>
                </thead>
                <tbody>
                <tr  th:each="excel_config : ${excel_config}">
                    <th scope="row" th:text="${excel_config.sheetName}">1</th>
                    <td th:text="${excel_config.titleRow}">Otto</td>
                    <td th:text="${excel_config.analysisCol}">6</td>
                    <td><a th:href="@{/toEdit(id=${excel_config.sheetName})}">编辑</a></td>
                    <td><a th:href="@{/delete(id=${excel_config.sheetName})}">删除</a></td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="form-group">
            <div class="col-sm-2 control-label">
                <a href="/toAdd" th:href="@{/toAdd}" class="btn btn-info">新增</a>
            </div>
        </div>

        <div class="form-group">
            <label for="excelfile1" class="container">请选择excel:</label>
            <input type="file" name="file" id="excelfile1" class="form-control" accept=".xlsx, .xls" style="width: 400px;"/>
        </div>
        <input type="submit" class="btn btn-primary" value="上传并解析excel"/>


    </form>



</div>

</body>
</html>
