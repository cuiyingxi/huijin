<!DOCTYPE html>
<!--suppress ALL-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>用户列表</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.css}"></link>
    <link rel="shortcut icon" th:href="@{/images/favicon.ico}" />
</head>
<body class="container">
<br/>
<h1>用户列表</h1>
<br/><br/>
<div class="with:80%">
    <table class="table table-hover">
        <thead>
        <tr>
            <th>#</th>
            <th>用户名</th>
            <th>密码</th>
            <th>工程</th>
            <th>手机号</th>
            <th>编辑</th>
            <th>删除</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <th scope="row" th:text="${user.id}">1</th>
            <td th:text="${user.userName}">用户名1</td>
            <td th:text="${user.password}">密码1</td>
            <td th:text="${user.project}">工程1</td>
            <td th:text="${user.phoneNumber}">手机号1</td>
            <td><a th:href="@{/user/toEdit(id=${user.id})}">编辑</a></td>
            <td><a th:href="@{/user/delete(id=${user.id})}">删除</a></td>
        </tr>
        </tbody>
    </table>
</div>
<div class="form-group">
    <div class="col-sm-2 control-label">
        <a href="/user/toAdd" th:href="@{/user/toAdd}" class="btn btn-info">新增</a>
    </div>
</div>

</body>
</html>
